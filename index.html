<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>דשבורד מכירות ספרים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --bg: #f5f4f0;
  --surface: #ffffff;
  --surface2: #f0efe9;
  --border: #e0ddd4;
  --accent: #2d5a3d;
  --accent2: #4a8c5c;
  --accent3: #e8f4ec;
  --gold: #c9a84c;
  --gold2: #f0e6c8;
  --text: #1a1a16;
  --text-muted: #6b6b5a;
  --text-dim: #9e9e88;
  --new: #2d5a3d;
  --veteran-new: #c9a84c;
  --success: #2d5a3d;
  --warning: #c9a84c;
  --danger: #c0392b;
  --radius: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Heebo', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ── Header ── */
.header {
  background: var(--accent);
  color: #fff;
  padding: 20px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 16px rgba(45,90,61,0.2);
}
.header-title { font-size: 22px; font-weight: 700; }
.header-sub { font-size: 13px; opacity: 0.75; margin-top: 2px; }
.header-right { display: flex; align-items: center; gap: 12px; }

.year-selector {
  display: flex;
  gap: 6px;
}
.year-btn {
  padding: 6px 14px;
  border-radius: 20px;
  border: 1.5px solid rgba(255,255,255,0.3);
  background: transparent;
  color: #fff;
  font-family: 'Heebo', sans-serif;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
.year-btn.active { background: #fff; color: var(--accent); font-weight: 700; border-color: #fff; }
.year-btn:hover:not(.active) { background: rgba(255,255,255,0.15); }

.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #5dde82;
  animation: pulse 2s infinite;
  display: inline-block;
  margin-left: 6px;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* ── Layout ── */
.main { padding: 28px 32px; max-width: 1400px; margin: 0 auto; }

/* ── Loading ── */
.loading-overlay {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 999;
  transition: opacity 0.4s;
}
.loading-overlay.hidden { opacity: 0; pointer-events: none; }
.loader {
  width: 48px; height: 48px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 14px; color: var(--text-muted); }

/* ── Error ── */
.error-banner {
  background: #fdf0ef;
  border: 1px solid #f5c6c2;
  border-radius: 12px;
  padding: 16px 20px;
  color: var(--danger);
  margin-bottom: 24px;
  display: none;
  font-size: 14px;
}

/* ── KPI Cards ── */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 28px;
}
.kpi-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 24px;
  transition: transform 0.2s, box-shadow 0.2s;
  cursor: default;
}
.kpi-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
.kpi-label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; }
.kpi-value { font-size: 32px; font-weight: 900; color: var(--text); line-height: 1; }
.kpi-sub { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
.kpi-delta { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; margin-top: 6px; }
.kpi-delta.up { color: var(--success); }
.kpi-delta.down { color: var(--danger); }

.kpi-card.accent { background: var(--accent); border-color: var(--accent); }
.kpi-card.accent .kpi-label { color: rgba(255,255,255,0.6); }
.kpi-card.accent .kpi-value { color: #fff; }
.kpi-card.accent .kpi-sub { color: rgba(255,255,255,0.7); }

/* ── Grid sections ── */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 20px; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
}
.card-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card-title-badge {
  font-size: 11px;
  font-weight: 500;
  padding: 3px 10px;
  border-radius: 20px;
  background: var(--accent3);
  color: var(--accent);
}

/* ── Books bar chart ── */
.book-bar-list { display: flex; flex-direction: column; gap: 12px; }
.book-bar-item { }
.book-bar-header { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 13px; }
.book-bar-name { font-weight: 500; color: var(--text); }
.book-bar-count { font-weight: 700; color: var(--accent); }
.book-bar-track { background: var(--surface2); border-radius: 4px; height: 8px; overflow: hidden; }
.book-bar-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.8s cubic-bezier(.16,1,.3,1); }
.book-bar-compare { font-size: 11px; color: var(--text-dim); margin-top: 3px; }

/* ── Status chart ── */
.status-list { display: flex; flex-direction: column; gap: 10px; }
.status-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  border-radius: 10px;
  background: var(--surface2);
  font-size: 13px;
}
.status-dot-colored { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.status-name { flex: 1; font-weight: 500; }
.status-count { font-weight: 700; font-size: 16px; }
.status-pct { font-size: 11px; color: var(--text-dim); margin-right: 4px; }

/* ── Cities ── */
.city-list { display: flex; flex-direction: column; gap: 8px; }
.city-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.city-item:last-child { border-bottom: none; }
.city-name { font-weight: 500; }
.city-count { font-weight: 700; color: var(--accent); background: var(--accent3); padding: 2px 10px; border-radius: 20px; font-size: 12px; }

/* ── Table ── */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  background: var(--surface2);
  padding: 10px 14px;
  text-align: right;
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  text-transform: uppercase;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--surface2); }

.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
}
.badge-new { background: #e6f4ec; color: #1a6b35; border: 1px solid #b7ddc6; }
.badge-veteran-new { background: var(--gold2); color: #7a5c00; border: 1px solid #e0cc8a; }
.badge-supplied { background: #e6f4ec; color: #1a6b35; }
.badge-pending { background: #fff8e6; color: #7a5c00; }
.badge-ordered { background: #e8f0ff; color: #2d4fa0; }
.badge-paid { background: #f0e6ff; color: #5a2d82; }

/* ── Comparison section ── */
.compare-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.compare-card {
  background: var(--surface2);
  border-radius: 12px;
  padding: 14px 16px;
  text-align: center;
}
.compare-book { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
.compare-nums { display: flex; justify-content: space-around; margin-bottom: 6px; }
.compare-num { font-size: 13px; }
.compare-num span { display: block; font-size: 18px; font-weight: 900; }
.compare-num small { font-size: 10px; color: var(--text-dim); }
.compare-delta {
  font-size: 12px; font-weight: 700;
  padding: 2px 8px; border-radius: 20px;
  display: inline-block;
}
.delta-up { background: #e6f4ec; color: #1a6b35; }
.delta-down { background: #fdf0ef; color: var(--danger); }
.delta-same { background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border); }

/* ── Filter bar ── */
.filter-bar {
  display: flex; gap: 10px; align-items: center;
  margin-bottom: 20px; flex-wrap: wrap;
}
.filter-input {
  flex: 1; min-width: 200px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 9px 14px;
  font-family: 'Heebo', sans-serif;
  font-size: 14px;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}
.filter-input:focus { border-color: var(--accent); }
.filter-select {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 9px 14px;
  font-family: 'Heebo', sans-serif;
  font-size: 13px;
  color: var(--text);
  outline: none;
  cursor: pointer;
}
.filter-count { font-size: 13px; color: var(--text-muted); white-space: nowrap; }

/* ── Tabs ── */
.tabs { display: flex; gap: 4px; margin-bottom: 28px; border-bottom: 2px solid var(--border); }
.tab {
  padding: 10px 20px;
  font-family: 'Heebo', sans-serif;
  font-size: 14px;
  font-weight: 500;
  border: none;
  background: none;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: all 0.2s;
}
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
.tab:hover:not(.active) { color: var(--text); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── Not supplied list ── */
.alert-list { display: flex; flex-direction: column; gap: 8px; }
.alert-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px;
  background: #fff8e6;
  border: 1px solid #f5e0a0;
  border-radius: 10px;
  font-size: 13px;
}
.alert-icon { font-size: 16px; flex-shrink: 0; }
.alert-name { font-weight: 600; flex: 1; }
.alert-city { color: var(--text-muted); font-size: 12px; }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loader"></div>
  <div class="loading-text" id="loadingText">טוען נתונים מגוגל שיטס...</div>
</div>

<div class="header">
  <div>
    <div class="header-title">📚 דשבורד מכירות ספרים</div>
    <div class="header-sub"><span class="status-dot"></span> מחובר לגוגל שיטס</div>
  </div>
  <div class="header-right">
    <div class="year-selector" id="yearSelector"></div>
  </div>
</div>

<div class="main">
  <div class="error-banner" id="errorBanner"></div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('dashboard')">דשבורד</button>
    <button class="tab" onclick="switchTab('clients')">לקוחות</button>
    <button class="tab" onclick="switchTab('compare')">השוואה שנתית</button>
    <button class="tab" onclick="switchTab('alerts')">התראות</button>
  </div>

  <!-- ══ TAB: Dashboard ══ -->
  <div class="tab-panel active" id="tab-dashboard">
    <div class="kpi-grid" id="kpiGrid"></div>
    <div class="grid-2">
      <div class="card">
        <div class="card-title">ספרים שהוזמנו <span class="card-title-badge" id="yearLabel">—</span></div>
        <div class="book-bar-list" id="bookBars"></div>
      </div>
      <div class="card">
        <div class="card-title">סטטוס הזמנות</div>
        <div style="max-width:260px;margin:0 auto"><canvas id="statusChart"></canvas></div>
        <div class="status-list" id="statusList" style="margin-top:16px"></div>
      </div>
    </div>
    <div class="grid-2">
      <div class="card">
        <div class="card-title">לקוחות לפי עיר</div>
        <div class="city-list" id="cityList"></div>
      </div>
      <div class="card">
        <div class="card-title">לא סופקו עדיין</div>
        <div class="alert-list" id="notSuppliedList"></div>
      </div>
    </div>
  </div>

  <!-- ══ TAB: Clients ══ -->
  <div class="tab-panel" id="tab-clients">
    <div class="filter-bar">
      <input class="filter-input" id="searchInput" placeholder="חיפוש לפי שם / עיר..." oninput="filterTable()"/>
      <select class="filter-select" id="cityFilter" onchange="filterTable()">
        <option value="">כל הערים</option>
      </select>
      <select class="filter-select" id="statusFilter" onchange="filterTable()">
        <option value="">כל הסטטוסים</option>
        <option value="סופק">סופק</option>
        <option value="לא סופק">לא סופק</option>
      </select>
      <select class="filter-select" id="bookFilter" onchange="filterTable()">
        <option value="">כל הספרים</option>
      </select>
      <span class="filter-count" id="filterCount"></span>
    </div>
    <div class="card">
      <div class="table-wrap">
        <table id="clientsTable">
          <thead id="clientsHead"></thead>
          <tbody id="clientsBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ══ TAB: Compare ══ -->
  <div class="tab-panel" id="tab-compare">
    <div class="card" style="margin-bottom:20px">
      <div class="card-title">השוואה שנתית — כמויות לפי ספר</div>
      <canvas id="compareChart" height="120"></canvas>
    </div>
    <div class="card">
      <div class="card-title">פירוט השוואה</div>
      <div class="compare-grid" id="compareGrid"></div>
    </div>
  </div>

  <!-- ══ TAB: Alerts ══ -->
  <div class="tab-panel" id="tab-alerts">
    <div class="grid-2">
      <div class="card">
        <div class="card-title">🆕 לקוחות חדשים השנה</div>
        <div class="alert-list" id="newClientsList"></div>
      </div>
      <div class="card">
        <div class="card-title">🟡 ספר חדש אצל לקוח ותיק</div>
        <div class="alert-list" id="newBookVeteranList"></div>
      </div>
    </div>
    <div class="card" style="margin-top:20px">
      <div class="card-title">⏳ ממתינים לתשלום / אישור</div>
      <div class="alert-list" id="pendingList"></div>
    </div>
  </div>
</div>

<script>
// ══ Config ══
const SHEET_ID   = '151HfnYDeUVQc7qbtr5bqkPgLtPOrWhIAJE0nsdqDq2o';
const YEAR_TABS  = [
  { label: "תשפ\"ו", tab: "מכירות לקראת תשפו" },
  { label: "תשפ\"ה", tab: "מכירות לקראת תשפה ב\"ה" },
];

// ══ State ══
let allData    = {};   // { tabLabel: [rows] }
let headers    = {};   // { tabLabel: [headers] }
let activeYear = YEAR_TABS[0].label;
let statusChartInst = null, compareChartInst = null;

// ══ Book columns (auto-detected or hardcoded) ══
const BOOK_COLS = [
  'ברוכה הבאה א',
  'ברוכה הבאה ד',
  'חברה לעט',
  'מתחברת למילים',
  'זה כל הסיפור',
  'מבינה עניין ה',
  'מבינה עניין ד',
  'כשתקראי תביני',
];

const STATUS_COLS = ['האם סופק', 'סופק'];
const CITY_COL    = ['עיר', 'כתובת יד', 'N'];
const NAME_COL    = ['ארגון שם הלמוד', 'ארגון', 'שם'];
const SUPPLY_COL  = ['משלוח ע"י', 'משלוח'];
const NOTES_COL   = ['הערות'];

// ══ Fetch ══
async function fetchSheet(tabName) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tabName)}`;
  const res  = await fetch(url);
  const text = await res.text();
  const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
  const cols = json.table.cols.map(c => c.label || '');
  const rows = json.table.rows.map(r =>
    Object.fromEntries(cols.map((c, i) => [c, r.c[i]?.v ?? '']))
  );
  return { cols, rows };
}

function findCol(cols, candidates) {
  for (const c of candidates) {
    const found = cols.find(col => col.includes(c));
    if (found) return found;
  }
  return candidates[0];
}

// ══ Init ══
async function init() {
  buildYearButtons();
  setLoading('טוען נתונים...');
  try {
    for (const y of YEAR_TABS) {
      try {
        const { cols, rows } = await fetchSheet(y.tab);
        allData[y.label]  = rows;
        headers[y.label]  = cols;
      } catch(e) {
        console.warn('Could not load', y.tab, e);
      }
    }
    if (!allData[activeYear]) {
      showError('לא ניתן לטעון נתונים — בדוק שהגיליון משותף לצפייה');
      hideLoading();
      return;
    }
    render();
    hideLoading();
  } catch(e) {
    showError('שגיאה בטעינת הנתונים: ' + e.message);
    hideLoading();
  }
}

function buildYearButtons() {
  const cont = document.getElementById('yearSelector');
  YEAR_TABS.forEach(y => {
    const btn = document.createElement('button');
    btn.className = 'year-btn' + (y.label === activeYear ? ' active' : '');
    btn.textContent = y.label;
    btn.onclick = () => {
      activeYear = y.label;
      document.querySelectorAll('.year-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    };
    cont.appendChild(btn);
  });
}

// ══ Render ══
function render() {
  const rows  = allData[activeYear] || [];
  const cols  = headers[activeYear] || [];
  const prevY = YEAR_TABS[1]?.label;
  const prev  = allData[prevY] || [];

  const nameCol   = findCol(cols, NAME_COL);
  const cityCol   = findCol(cols, CITY_COL);
  const statusCol = findCol(cols, STATUS_COLS);
  const notesCol  = findCol(cols, NOTES_COL);

  document.getElementById('yearLabel').textContent = activeYear;
  renderKPIs(rows, cols, prev, nameCol, statusCol);
  renderBookBars(rows, cols, prev);
  renderStatusChart(rows, statusCol);
  renderCities(rows, cityCol);
  renderNotSupplied(rows, nameCol, cityCol, statusCol);
  renderClientsTable(rows, cols, nameCol, cityCol, statusCol);
  renderCompare(rows, cols, prev, headers[prevY] || []);
  renderAlerts(rows, cols, prev, nameCol, cityCol);
}

// ── KPIs ──
function renderKPIs(rows, cols, prev, nameCol, statusCol) {
  const total    = rows.length;
  const supplied = rows.filter(r => String(r[statusCol] || '').includes('סופק') || String(r[statusCol] || '').toLowerCase().includes('כן')).length;
  const pending  = total - supplied;

  let totalBooks = 0;
  BOOK_COLS.forEach(b => {
    const col = cols.find(c => c.includes(b));
    if (col) rows.forEach(r => { totalBooks += Number(r[col]) || 0; });
  });

  let prevBooks = 0;
  if (prev.length) {
    const prevCols = headers[YEAR_TABS[1]?.label] || [];
    BOOK_COLS.forEach(b => {
      const col = prevCols.find(c => c.includes(b));
      if (col) prev.forEach(r => { prevBooks += Number(r[col]) || 0; });
    });
  }

  const delta = prevBooks ? Math.round((totalBooks - prevBooks) / prevBooks * 100) : null;

  document.getElementById('kpiGrid').innerHTML = `
    <div class="kpi-card accent">
      <div class="kpi-label">סה"כ לקוחות</div>
      <div class="kpi-value">${total}</div>
      <div class="kpi-sub">${activeYear}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">סה"כ ספרים</div>
      <div class="kpi-value">${totalBooks.toLocaleString()}</div>
      ${delta !== null ? `<div class="kpi-delta ${delta>=0?'up':'down'}">${delta>=0?'▲':'▼'} ${Math.abs(delta)}% משנה שעברה</div>` : '<div class="kpi-sub">—</div>'}
    </div>
    <div class="kpi-card">
      <div class="kpi-label">סופקו</div>
      <div class="kpi-value" style="color:var(--success)">${supplied}</div>
      <div class="kpi-sub">${total ? Math.round(supplied/total*100) : 0}% מהלקוחות</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">ממתינים לאספקה</div>
      <div class="kpi-value" style="color:var(--warning)">${pending}</div>
      <div class="kpi-sub">עדיין לא סופקו</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">מדריכים למורה</div>
      <div class="kpi-value">${Math.floor(totalBooks/40)}</div>
      <div class="kpi-sub">כל 40 ספרים = 1</div>
    </div>
  `;
}

// ── Book bars ──
function renderBookBars(rows, cols, prev) {
  const prevCols = headers[YEAR_TABS[1]?.label] || [];
  const items = BOOK_COLS.map(b => {
    const col = cols.find(c => c.includes(b));
    const qty  = col ? rows.reduce((s, r) => s + (Number(r[col]) || 0), 0) : 0;
    const pCol = prevCols.find(c => c.includes(b));
    const pQty = pCol ? (allData[YEAR_TABS[1]?.label] || []).reduce((s, r) => s + (Number(r[pCol]) || 0), 0) : 0;
    return { name: b, qty, pQty };
  }).filter(i => i.qty > 0).sort((a,b) => b.qty - a.qty);

  const max = Math.max(...items.map(i => i.qty), 1);
  document.getElementById('bookBars').innerHTML = items.map(i => {
    const delta = i.pQty ? Math.round((i.qty - i.pQty) / i.pQty * 100) : null;
    return `<div class="book-bar-item">
      <div class="book-bar-header">
        <span class="book-bar-name">${i.name}</span>
        <span class="book-bar-count">${i.qty.toLocaleString()}</span>
      </div>
      <div class="book-bar-track"><div class="book-bar-fill" style="width:${Math.round(i.qty/max*100)}%"></div></div>
      ${delta !== null ? `<div class="book-bar-compare">${delta>=0?'▲':'▼'} ${Math.abs(delta)}% מ-${YEAR_TABS[1]?.label} (${i.pQty.toLocaleString()})</div>` : ''}
    </div>`;
  }).join('');
}

// ── Status chart ──
function renderStatusChart(rows, statusCol) {
  const counts = {};
  rows.forEach(r => {
    const s = String(r[statusCol] || 'לא ידוע').trim() || 'לא ידוע';
    counts[s] = (counts[s] || 0) + 1;
  });

  const labels = Object.keys(counts);
  const vals   = Object.values(counts);
  const colors = ['#2d5a3d','#4a8c5c','#c9a84c','#e8b84b','#c0392b','#9b9b7a'];

  if (statusChartInst) statusChartInst.destroy();
  const ctx = document.getElementById('statusChart').getContext('2d');
  statusChartInst = new Chart(ctx, {
    type: 'doughnut',
    data: { labels, datasets: [{ data: vals, backgroundColor: colors.slice(0, labels.length), borderWidth: 2, borderColor: '#fff' }] },
    options: { plugins: { legend: { display: false } }, cutout: '65%' }
  });

  const total = rows.length;
  document.getElementById('statusList').innerHTML = labels.map((l, i) =>
    `<div class="status-item">
      <div class="status-dot-colored" style="background:${colors[i]}"></div>
      <span class="status-name">${l}</span>
      <span class="status-pct">${Math.round(vals[i]/total*100)}%</span>
      <span class="status-count">${vals[i]}</span>
    </div>`
  ).join('');
}

// ── Cities ──
function renderCities(rows, cityCol) {
  const counts = {};
  rows.forEach(r => {
    const c = String(r[cityCol] || '').trim() || 'לא ידוע';
    counts[c] = (counts[c] || 0) + 1;
  });
  const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]).slice(0, 10);
  document.getElementById('cityList').innerHTML = sorted.map(([city, cnt]) =>
    `<div class="city-item"><span class="city-name">${city}</span><span class="city-count">${cnt}</span></div>`
  ).join('');
}

// ── Not supplied ──
function renderNotSupplied(rows, nameCol, cityCol, statusCol) {
  const ns = rows.filter(r => !String(r[statusCol]||'').includes('סופק') && !String(r[statusCol]||'').toLowerCase().includes('כן'));
  document.getElementById('notSuppliedList').innerHTML = ns.slice(0,8).map(r =>
    `<div class="alert-item">
      <span class="alert-icon">⏳</span>
      <span class="alert-name">${r[nameCol]||'—'}</span>
      <span class="alert-city">${r[cityCol]||''}</span>
    </div>`
  ).join('') || '<div style="color:var(--text-muted);font-size:13px">הכל סופק! 🎉</div>';
}

// ── Clients table ──
function renderClientsTable(rows, cols, nameCol, cityCol, statusCol) {
  // City filter options
  const cities = [...new Set(rows.map(r => String(r[cityCol]||'').trim()).filter(Boolean))].sort();
  const cf = document.getElementById('cityFilter');
  const cur = cf.value;
  cf.innerHTML = '<option value="">כל הערים</option>' + cities.map(c => `<option value="${c}" ${c===cur?'selected':''}>${c}</option>`).join('');

  // Book filter options
  const bf = document.getElementById('bookFilter');
  const bcur = bf.value;
  bf.innerHTML = '<option value="">כל הספרים</option>' + BOOK_COLS.map(b => `<option value="${b}" ${b===bcur?'selected':''}>${b}</option>`).join('');

  const displayCols = [nameCol, cityCol, statusCol, ...BOOK_COLS.filter(b => cols.find(c => c.includes(b)))];
  document.getElementById('clientsHead').innerHTML =
    '<tr>' + displayCols.map(c => `<th>${c}</th>`).join('') + '</tr>';

  window._tableRows = rows;
  window._tableDisplayCols = displayCols;
  window._tableNameCol = nameCol;
  window._tableCityCol = cityCol;
  window._tableStatusCol = statusCol;
  window._tableCols = cols;
  filterTable();
}

function filterTable() {
  const q    = document.getElementById('searchInput').value.toLowerCase();
  const city = document.getElementById('cityFilter').value;
  const stat = document.getElementById('statusFilter').value;
  const book = document.getElementById('bookFilter').value;

  const rows        = window._tableRows || [];
  const displayCols = window._tableDisplayCols || [];
  const nameCol     = window._tableNameCol;
  const cityCol     = window._tableCityCol;
  const statusCol   = window._tableStatusCol;
  const cols        = window._tableCols || [];

  const filtered = rows.filter(r => {
    if (q && !String(r[nameCol]||'').toLowerCase().includes(q) && !String(r[cityCol]||'').toLowerCase().includes(q)) return false;
    if (city && String(r[cityCol]||'').trim() !== city) return false;
    if (stat === 'סופק' && !String(r[statusCol]||'').includes('סופק') && !String(r[statusCol]||'').toLowerCase().includes('כן')) return false;
    if (stat === 'לא סופק' && (String(r[statusCol]||'').includes('סופק') || String(r[statusCol]||'').toLowerCase().includes('כן'))) return false;
    if (book) {
      const col = cols.find(c => c.includes(book));
      if (col && !(Number(r[col]) > 0)) return false;
    }
    return true;
  });

  document.getElementById('filterCount').textContent = `${filtered.length} לקוחות`;

  document.getElementById('clientsBody').innerHTML = filtered.map(r => {
    const isSupplied = String(r[statusCol]||'').includes('סופק') || String(r[statusCol]||'').toLowerCase().includes('כן');
    return '<tr>' + displayCols.map(c => {
      const v = r[c] ?? '';
      if (c === statusCol) return `<td><span class="badge ${isSupplied?'badge-supplied':'badge-pending'}">${v||'—'}</span></td>`;
      if (BOOK_COLS.includes(c)) return `<td style="text-align:center;font-weight:${Number(v)>0?'700':'400'};color:${Number(v)>0?'var(--accent)':'var(--text-dim)'}">${Number(v)>0?v:'—'}</td>`;
      return `<td>${v||'—'}</td>`;
    }).join('') + '</tr>';
  }).join('');
}

// ── Compare ──
function renderCompare(rows, cols, prev, prevCols) {
  const items = BOOK_COLS.map(b => {
    const col  = cols.find(c => c.includes(b));
    const pCol = prevCols.find(c => c.includes(b));
    const qty  = col  ? rows.reduce((s, r) => s + (Number(r[col]) || 0), 0) : 0;
    const pQty = pCol ? prev.reduce((s, r) => s + (Number(r[pCol]) || 0), 0) : 0;
    return { name: b, qty, pQty };
  });

  // Chart
  if (compareChartInst) compareChartInst.destroy();
  const ctx = document.getElementById('compareChart').getContext('2d');
  compareChartInst = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: items.map(i => i.name.length > 12 ? i.name.slice(0,12)+'…' : i.name),
      datasets: [
        { label: activeYear, data: items.map(i => i.qty), backgroundColor: '#2d5a3d' },
        { label: YEAR_TABS[1]?.label || 'שנה קודמת', data: items.map(i => i.pQty), backgroundColor: '#c9a84c' },
      ]
    },
    options: {
      plugins: { legend: { position: 'top' } },
      scales: { y: { beginAtZero: true } },
      responsive: true,
    }
  });

  // Cards
  document.getElementById('compareGrid').innerHTML = items.map(i => {
    const delta = i.pQty ? Math.round((i.qty - i.pQty) / i.pQty * 100) : null;
    const deltaClass = delta === null ? 'delta-same' : delta > 0 ? 'delta-up' : delta < 0 ? 'delta-down' : 'delta-same';
    const deltaText  = delta === null ? '—' : delta > 0 ? `▲ ${delta}%` : `▼ ${Math.abs(delta)}%`;
    return `<div class="compare-card">
      <div class="compare-book">${i.name}</div>
      <div class="compare-nums">
        <div class="compare-num"><span style="color:var(--accent)">${i.qty}</span><small>${activeYear}</small></div>
        <div class="compare-num"><span style="color:var(--gold)">${i.pQty}</span><small>${YEAR_TABS[1]?.label||'קודם'}</small></div>
      </div>
      <span class="compare-delta ${deltaClass}">${deltaText}</span>
    </div>`;
  }).join('');
}

// ── Alerts ──
function renderAlerts(rows, cols, prev, nameCol, cityCol) {
  const prevNames = new Set((prev || []).map(r => String(r[nameCol]||'').trim()));
  const newClients = rows.filter(r => !prevNames.has(String(r[nameCol]||'').trim()) && r[nameCol]);

  document.getElementById('newClientsList').innerHTML = newClients.slice(0,10).map(r =>
    `<div class="alert-item"><span class="alert-icon">🆕</span><span class="alert-name">${r[nameCol]}</span><span class="alert-city">${r[cityCol]||''}</span></div>`
  ).join('') || '<div style="color:var(--text-muted);font-size:13px">אין לקוחות חדשים</div>';

  // Veteran with new book
  const prevCols = headers[YEAR_TABS[1]?.label] || [];
  const veteranNew = [];
  rows.forEach(r => {
    if (!prevNames.has(String(r[nameCol]||'').trim())) return;
    BOOK_COLS.forEach(b => {
      const col  = cols.find(c => c.includes(b));
      const pCol = prevCols.find(c => c.includes(b));
      if (col && !pCol && Number(r[col]) > 0) {
        veteranNew.push({ name: r[nameCol], city: r[cityCol], book: b });
      }
    });
  });

  document.getElementById('newBookVeteranList').innerHTML = veteranNew.slice(0,8).map(v =>
    `<div class="alert-item"><span class="alert-icon">📗</span><span class="alert-name">${v.name}</span><span class="alert-city">${v.book}</span></div>`
  ).join('') || '<div style="color:var(--text-muted);font-size:13px">אין</div>';

  // Pending
  const statusCol = findCol(cols, STATUS_COLS);
  const pending = rows.filter(r => {
    const s = String(r[statusCol]||'');
    return s.includes('הוזמן') || s.includes('ממתין') || (!s.includes('סופק') && !s.toLowerCase().includes('כן') && s.trim());
  });

  document.getElementById('pendingList').innerHTML = pending.slice(0,10).map(r =>
    `<div class="alert-item"><span class="alert-icon">⏳</span><span class="alert-name">${r[nameCol]||'—'}</span><span class="alert-city">${r[cityCol]||''}</span></div>`
  ).join('') || '<div style="color:var(--text-muted);font-size:13px">אין ממתינים 🎉</div>';
}

// ── Tabs ──
function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['dashboard','clients','compare','alerts'][i] === name));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab-'+name));
}

// ── Helpers ──
function setLoading(msg) {
  document.getElementById('loadingText').textContent = msg;
  document.getElementById('loadingOverlay').classList.remove('hidden');
}
function hideLoading() {
  document.getElementById('loadingOverlay').classList.add('hidden');
}
function showError(msg) {
  const b = document.getElementById('errorBanner');
  b.style.display = 'block';
  b.textContent = '⚠️ ' + msg;
}

init();
</script>
</body>
</html>
